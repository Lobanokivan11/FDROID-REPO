Description: "<h1 id=\"why-webui-x\" tabindex=\"-1\">Why WebUI X?</h1>\n<p>WebUI X is the next-generation framework for building modular, secure, and high-performance WebUI applications. It offers significant improvements over Legacy KernelSU WebUI, making it the ideal choice for developers. Below are the key reasons to switch:</p>\n<h2 id=\"\U0001F680-key-advantages\" tabindex=\"-1\">\U0001F680&nbsp;<strong>Key Advantages</strong></h2>\n<h3 id=\"_1-enhanced-security\" tabindex=\"-1\">1.&nbsp;<strong>Enhanced Security</strong></h3>\n<ul>\n<li><strong>Content Security Policy (CSP):</strong>&nbsp;Restricts unsafe scripts and resources, preventing XSS attacks.</li>\n<li><strong>Kill Shell:</strong>&nbsp;Automatically terminates background processes to block unauthorized code execution.</li>\n<li><strong>Strict Isolation:</strong>&nbsp;Plugins and modules run in controlled environments, reducing vulnerabilities.</li>\n</ul>\n<h3 id=\"_2-superior-performance\" tabindex=\"-1\">2.&nbsp;<strong>Superior Performance</strong></h3>\n<ul>\n<li><strong>Smart Caching:</strong>&nbsp;Configurable&nbsp;<code>Cache Max Age</code>&nbsp;and resource caching improve load times.</li>\n<li><strong>Optimized Rendering:</strong>&nbsp;Features like&nbsp;<code>Window Resize</code>&nbsp;and&nbsp;<code>Auto Style StatusBars</code>&nbsp;ensure smooth UI adaptation.</li>\n</ul>\n<h3 id=\"_3-powerful-debugging-tools\" tabindex=\"-1\">3.&nbsp;<strong>Powerful Debugging Tools</strong></h3>\n<div class=\"google-auto-placed ap_container\">&nbsp;</div>\n<ul>\n<li><strong>Built-in Eruda Console:</strong>&nbsp;Auto-injected for real-time debugging.</li>\n<li><strong>Remote URL Debugging:</strong>&nbsp;Test locally via&nbsp;<code>http://localhost</code>&nbsp;for faster iterations.</li>\n<li><strong>Developer Mode:</strong>&nbsp;Reveals module IDs and advanced metrics for troubleshooting.</li>\n</ul>\n<h3 id=\"_4-extensibility-customization\" tabindex=\"-1\">4.&nbsp;<strong>Extensibility &amp; Customization</strong></h3>\n<ul>\n<li><strong>Plugin Ecosystem:</strong>&nbsp;Supports APK and DEX plugins (e.g.,&nbsp;<a href=\"https://github.com/MMRLApp/WXU\" target=\"_blank\" rel=\"noreferrer\">WXU</a>) for limitless functionality.</li>\n<li><strong>SPA-Friendly:</strong>&nbsp;<code>History Fallback</code>&nbsp;ensures seamless navigation in single-page apps.</li>\n<li><strong>UI Control:</strong>&nbsp;Customize back-button behavior, refresh interceptors, and exit confirmations.</li>\n</ul>\n<h3 id=\"_5-modern-ux-features\" tabindex=\"-1\">5.&nbsp;<strong>Modern UX Features</strong></h3>\n<ul>\n<li><strong>Pull-to-Refresh:</strong>&nbsp;User-friendly reloading (beta).</li>\n<li><strong>Dynamic Theming:</strong>&nbsp;Match status bars to&nbsp;<a class=\"google-anno\" href=\"https://mmrl.dev/guide/webuix/#\" data-google-vignette=\"false\" data-google-interstitial=\"false\">&nbsp;<span class=\"google-anno-t\">app</span></a>&nbsp;themes for visual consistency.</li>\n</ul>\n<h3 id=\"_6-cross-platform-compatibility\" tabindex=\"-1\">6.&nbsp;<strong>Cross-Platform Compatibility</strong></h3>\n<ul>\n<li>Works with&nbsp;<strong>KernelSU (Next), SukiSU Ultra, Magisk, APatch</strong>, and even&nbsp;<strong>non-rooted devices</strong>.</li>\n</ul>\n"
